  <head>

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=optional" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=optional" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=optional" /></noscript>
    <meta name="description" content="Shnoor International provides global IT services, cloud solutions, logistics management, and trade intelligence to bridge innovation with expert reach." />
    <title>Shnoor International | Global IT & Trade Solutions</title>
    <style>
      body { margin: 0; background-color: #0f172a; }
      #root-skeleton {
        min-height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
      }
      #root-skeleton h1 {
        color: #fff;
        font-family: sans-serif;
        font-size: 2rem;
        margin-bottom: 20px;
        letter-spacing: 2px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position: relative; width: 100vw; height: 650px; background-color: #0f172a; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <img 
          src="https://images.weserv.nl/?url=images.unsplash.com/photo-1451187580459-43490279c0fa&w=1200&q=60&output=webp" 
          srcset="
              https://images.weserv.nl/?url=images.unsplash.com/photo-1451187580459-43490279c0fa&w=600&q=60&output=webp 600w,
              https://images.weserv.nl/?url=images.unsplash.com/photo-1451187580459-43490279c0fa&w=1200&q=60&output=webp 1200w,
              https://images.weserv.nl/?url=images.unsplash.com/photo-1451187580459-43490279c0fa&w=2000&q=60&output=webp 2000w
          "
          sizes="100vw"
          alt="Background" 
          fetchpriority="high" 
          style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.4;" 
        />
        <div style="position: relative; z-index: 10; text-align: center; color: white; padding: 0 20px;">
          <h1 style="font-family: sans-serif; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 800; line-height: 1.1; margin: 0; text-shadow: 0 10px 40px rgba(0,0,0,0.4);">
            Bridging Innovation and Trade with Expert Reach
          </h1>
          <div class="spinner" style="margin: 40px auto 0;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

    <style>
      body { margin: 0; background-color: #0f172a; }
      #root-skeleton {
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
